version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 24
    commands:
      - node --version
      - npm --version
      - npm ci

  pre_build:
    commands:
      - '[ -n "$VITE_API_BASE_URL" ] || { echo "VITE_API_BASE_URL is required"; exit 1; }'
      - 'case "$VITE_API_BASE_URL" in https://*) ;; *) echo "VITE_API_BASE_URL must use HTTPS"; exit 1;; esac'

  build:
    commands:
      - npm run lint
      - npm run build

artifacts:
  base-directory: dist
  files:
    - '**/*'
  discard-paths: no